<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem Regressiva | Lourena 🌿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(160deg, #eaf3ee 0%, #d2e6dc 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --primary: #4c7c63;
      --primary-dark: #284b39;
      --accent: #8ab89f;
      --text-main: #1f362a;
      --text-muted: #4b6859;
      --badge-bg: #dcece3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.8s ease;
      overflow-x: hidden;
      position: relative;
    }

    /* Confetes para o dia 19 */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      max-width: 460px;
      width: 100%;
      padding: 32px 26px 28px;
      box-shadow: 0 20px 45px rgba(31, 54, 42, 0.08);
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.7s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--badge-bg);
      color: var(--primary-dark);
      font-weight: 600;
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
      letter-spacing: 0.3px;
      transition: all 0.5s ease;
    }

    /* Container da Ilustração Cartoon */
    .illustration-box {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
      background: #e1efe8;
      position: relative;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.04);
    }

    .illustration-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Animações sutis dos elementos SVG */
    .anim-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
    .anim-wave {
      animation: waveMove 5s ease-in-out infinite alternate;
    }
    .anim-sway {
      transform-origin: bottom center;
      animation: swayTree 3.8s ease-in-out infinite alternate;
    }
    .anim-cablecar {
      animation: cableCarMove 6s ease-in-out infinite alternate;
    }
    .anim-pulse {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes waveMove {
      0% { transform: translateX(-6px); }
      100% { transform: translateX(6px); }
    }
    @keyframes swayTree {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2.5deg); }
    }
    @keyframes cableCarMove {
      0% { transform: translate(-12px, 5px); }
      100% { transform: translate(12px, -5px); }
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1.25;
      margin-bottom: 12px;
    }

    p.message {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Relógio Regressivo */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }

    .time-box {
      background: #f4f9f6;
      border: 1px solid rgba(76, 124, 99, 0.15);
      border-radius: 16px;
      padding: 12px 6px;
    }

    .time-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--primary-dark);
      display: block;
    }

    .time-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .bday-banner {
      display: none;
      background: linear-gradient(135deg, #2d5a44, #4c8568);
      color: #ffffff;
      padding: 14px;
      border-radius: 16px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.3px;
    }

    /* Barra de prévia para você testar os dias (opcional remover depois) */
    .preview-bar {
      margin-top: 22px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 5;
      opacity: 0.65;
      transition: opacity 0.3s;
    }
    .preview-bar:hover {
      opacity: 1;
    }
    .preview-bar button {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(40, 75, 57, 0.2);
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preview-bar button:hover, .preview-bar button.active {
      background: var(--primary-dark);
      color: #fff;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <main class="card">
    <div class="badge" id="day-badge">🌿 Carregando...</div>

    <div class="illustration-box" id="illustration-container">
      <!-- Ilustração SVG será injetada aqui -->
    </div>

    <h1 id="day-title">Operação Aniversário</h1>
    <p class="message" id="day-message">Preparando tudo...</p>

    <div class="countdown-grid" id="countdown-box">
      <div class="time-box">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Dias</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Horas</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Min</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Seg</span>
      </div>
    </div>

    <div class="bday-banner" id="bday-banner">
      🌴 Vibe Rio & Verde Ativada: Aproveite o seu dia! 🥥
    </div>
  </main>

  <!-- REMOVA ESTE BLOCO ABAIXO SE NÃO QUISER OS BOTÕES DE TESTE NO SITE FINAL -->
  <div class="preview-bar" id="preview-controls">
    <button onclick="setDayTheme(16)" id="btn-16">Seg (16)</button>
    <button onclick="setDayTheme(17)" id="btn-17">Ter (17)</button>
    <button onclick="setDayTheme(18)" id="btn-18">Qua (18)</button>
    <button onclick="setDayTheme(19)" id="btn-19">Qui (19 - Níver)</button>
  </div>

  <script>
    // Ilustrações SVG Cartoon em Tons de Verde Fosco / Pastel
    const svgs = {
      // Dia 16: Pão de Açúcar e Bondinho
      16: `
        <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="200" fill="#dff0e7"/>
          <circle cx="320" cy="48" r="24" fill="#b7dec9" class="anim-pulse"/>
          <!-- Nuvens fofas -->
          <g fill="#f3faf6" class="anim-float">
            <circle cx="75" cy="45" r="14"/><circle cx="92" cy="42" r="18"/><circle cx="110" cy="46" r="13"/>
          </g>
          <!-- Morro da Urca (menor) -->
          <path d="M-10,165 Q55,75 125,165 Z" fill="#7da890"/>
          <!-- Pão de Açúcar (maior) -->
          <path d="M195,165 Q275,20 355,165 Z" fill="#548269"/>
          <!-- Cabo do Bondinho -->
          <line x1="65" y1="115" x2="275" y2="75" stroke="#355946" stroke-width="2" stroke-dasharray="4 2"/>
          <!-- Bondinho -->
          <g class="anim-cablecar">
            <line x1="170" y1="95" x2="170" y2="105" stroke="#284b39" stroke-width="2"/>
            <rect x="154" y="105" width="32" height="18" rx="5" fill="#284b39"/>
            <rect x="158" y="109" width="7" height="7" rx="1.5" fill="#dff0e7"/>
            <rect x="167" y="109" width="7" height="7" rx="1.5" fill="#dff0e7"/>
            <rect x="176" y="109" width="7" height="7" rx="1.5" fill="#dff0e7"/>
          </g>
          <!-- Mar e Ondas -->
          <rect x="0" y="155" width="400" height="45" fill="#63967b"/>
          <path d="M-20,168 Q30,160 80,168 T180,168 T280,168 T380,168 T440,168" fill="none" stroke="#a6cfb9" stroke-width="3" stroke-linecap="round" class="anim-wave"/>
          <path d="M-10,182 Q40,175 90,182 T190,182 T290,182 T390,182" fill="none" stroke="#3c6952" stroke-width="3" stroke-linecap="round" class="anim-wave"/>
        </svg>
      `,
      // Dia 17: Calçadão de Ipanema e Coqueiro
      17: `
        <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="200" fill="#d5ebe0"/>
          <!-- Sol pastel -->
          <circle cx="95" cy="55" r="28" fill="#a8d3bc" class="anim-pulse"/>
          <!-- Mar ao fundo -->
          <rect x="0" y="105" width="400" height="40" fill="#689c81"/>
          <path d="M0,120 Q50,114 100,120 T200,120 T300,120 T400,120" fill="none" stroke="#b8dec9" stroke-width="2.5" class="anim-wave"/>
          <!-- Areia -->
          <rect x="0" y="138" width="400" height="24" fill="#e6eee5"/>
          <!-- Calçadão de Ipanema (Ondas clássicas em verde escuro e creme) -->
          <rect x="0" y="160" width="400" height="40" fill="#f2f7f4"/>
          <path d="M-20,175 Q15,163 50,175 T120,175 T190,175 T260,175 T330,175 T400,175 T470,175" fill="none" stroke="#2c5440" stroke-width="8"/>
          <path d="M-20,192 Q15,180 50,192 T120,192 T190,192 T260,192 T330,192 T400,192 T470,192" fill="none" stroke="#487a60" stroke-width="7"/>
          <!-- Coqueiro estilizado -->
          <g class="anim-sway">
            <path d="M315,160 Q300,105 322,58" fill="none" stroke="#39614c" stroke-width="7" stroke-linecap="round"/>
            <path d="M322,58 Q285,48 272,72" fill="none" stroke="#284b39" stroke-width="5" stroke-linecap="round"/>
            <path d="M322,58 Q358,45 370,70" fill="none" stroke="#284b39" stroke-width="5" stroke-linecap="round"/>
            <path d="M322,58 Q292,30 278,42" fill="none" stroke="#4c8266" stroke-width="5" stroke-linecap="round"/>
            <path d="M322,58 Q350,28 364,42" fill="none" stroke="#4c8266" stroke-width="5" stroke-linecap="round"/>
            <circle cx="318" cy="64" r="4" fill="#1e3b2c"/>
            <circle cx="326" cy="64" r="4" fill="#1e3b2c"/>
          </g>
        </svg>
      `,
      // Dia 18: Pôr do sol no Arpoador
      18: `
        <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sky18" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c3e3d5"/>
              <stop offset="100%" stop-color="#e8f4ee"/>
            </linearGradient>
          </defs>
          <rect width="400" height="200" fill="url(#sky18)"/>
          <!-- Sol se pondo -->
          <circle cx="140" cy="128" r="38" fill="#8ec2a8" class="anim-pulse"/>
          <!-- Gaivotas -->
          <path d="M90,55 Q97,48 104,55 Q111,48 118,55" fill="none" stroke="#36634d" stroke-width="2.2" stroke-linecap="round" class="anim-float"/>
          <path d="M145,40 Q150,35 155,40 Q160,35 165,40" fill="none" stroke="#36634d" stroke-width="2" stroke-linecap="round" class="anim-float"/>
          <!-- Dois Irmãos no horizonte -->
          <path d="M15,135 L42,88 L62,118 L78,96 L105,135 Z" fill="#7aa891"/>
          <!-- Mar -->
          <rect x="0" y="135" width="400" height="65" fill="#467860"/>
          <path d="M20,152 Q80,146 140,152 T260,152" fill="none" stroke="#9ecbb4" stroke-width="2.5" stroke-linecap="round" class="anim-wave"/>
          <!-- Pedra do Arpoador -->
          <path d="M195,200 Q235,115 310,108 Q365,104 410,145 L410,200 Z" fill="#234736"/>
          <path d="M235,200 Q275,140 345,138 L410,165 L410,200 Z" fill="#183326"/>
        </svg>
      `,
      // Dia 19: Cristo Redentor Festivo
      19: `
        <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="200" fill="#cbe6d8"/>
          <!-- Brilhos / Estrelas festivas -->
          <g fill="#2d6349" class="anim-pulse">
            <circle cx="75" cy="45" r="3.5"/><circle cx="325" cy="40" r="4"/>
            <circle cx="115" cy="30" r="2.5"/><circle cx="285" cy="65" r="3"/>
            <path d="M60,85 L63,92 L70,95 L63,98 L60,105 L57,98 L50,95 L57,92 Z"/>
            <path d="M340,80 L343,87 L350,90 L343,93 L340,100 L337,93 L330,90 L337,87 Z"/>
          </g>
          <!-- Corcovado -->
          <path d="M70,200 Q200,115 330,200 Z" fill="#5d9478"/>
          <!-- Base do Cristo -->
          <rect x="184" y="132" width="32" height="18" rx="3" fill="#28523d"/>
          <!-- Estátua Cristo Redentor Cartoon -->
          <g class="anim-float">
            <!-- Corpo / Manto -->
            <path d="M191,132 L194,86 L206,86 L209,132 Z" fill="#1b3d2c"/>
            <!-- Braços abertos -->
            <rect x="158" y="88" width="84" height="9" rx="4.5" fill="#1b3d2c"/>
            <!-- Cabeça -->
            <circle cx="200" cy="77" r="7" fill="#1b3d2c"/>
          </g>
          <!-- Nuvens na base -->
          <g fill="#eef8f2" class="anim-wave">
            <circle cx="95" cy="185" r="22"/><circle cx="130" cy="182" r="28"/><circle cx="170" cy="188" r="24"/>
            <circle cx="235" cy="188" r="24"/><circle cx="275" cy="182" r="28"/><circle cx="310" cy="186" r="22"/>
          </g>
        </svg>
      `
    };

    // Configurações de cores e textos para cada dia (16 a 19 de Novembro)
    const dayConfigs = {
      16: {
        badge: "🌿 Faltam 3 dias • Segunda-feira",
        title: "Operação Lourena: Modo Contagem!",
        message: "A contagem regressiva começou oficialmente! Ainda faltam 3 dias, mas já vale ir entrando no clima de comemoração. Volta aqui amanhã porque o cenário muda.",
        bg: "linear-gradient(160deg, #ebf4ef 0%, #d4e8dd 100%)",
        primary: "#548269",
        primaryDark: "#284b39",
        badgeBg: "#d9ece2",
        isBday: false
      },
      17: {
        badge: "🌊 Faltam 2 dias • Terça-feira",
        title: "Passando no calçadão para avisar...",
        message: "Faltam só 2 dias para o seu aniversário! Já vai preparando o sorriso, a boa energia e o espaço para o bolo. Amanhã tem parada nova por aqui!",
        bg: "linear-gradient(160deg, #e4f1eb 0%, #c6e0d4 100%)",
        primary: "#487a60",
        primaryDark: "#234534",
        badgeBg: "#cfe6da",
        isBday: false
      },
      18: {
        badge: "🌅 Falta 1 dia • Véspera!",
        title: "Pôr do sol de véspera, Lourena!",
        message: "Últimas horas aproveitando a fase atual antes de subir de nível amanhã! Segura a ansiedade que falta muito pouco. Amanhã esse site ganha uma edição especial.",
        bg: "linear-gradient(160deg, #dcedf5 0%, #bfe0d3 100%)",
        primary: "#386b56",
        primaryDark: "#1c3d2f",
        badgeBg: "#c4e2d5",
        isBday: false
      },
      19: {
        badge: "🎉 19 de Novembro • O Grande Dia!",
        title: "Feliz Aniversário, Lourena! 🌿✨",
        message: "Chegou o seu dia! Que esse novo ciclo venha leve como brisa de praia, cheio de boas risadas, saúde, conquistas e dias incríveis. Aproveita muito!",
        bg: "linear-gradient(160deg, #d4ede0 0%, #a9d6bf 100%)",
        primary: "#285e45",
        primaryDark: "#163828",
        badgeBg: "#b7decb",
        isBday: true
      }
    };

    // Data alvo: 19 de Novembro de 2026 às 00:00:00
    const targetDate = new Date("2026-11-19T00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById("countdown-box").style.display = "none";
        document.getElementById("bday-banner").style.display = "block";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, "0");
      document.getElementById("hours").innerText = String(hours).padStart(2, "0");
      document.getElementById("minutes").innerText = String(minutes).padStart(2, "0");
      document.getElementById("seconds").innerText = String(seconds).padStart(2, "0");
    }

    function setDayTheme(dayNumber) {
      const config = dayConfigs[dayNumber] || dayConfigs[16];

      document.body.style.background = config.bg;
      document.documentElement.style.setProperty('--primary', config.primary);
      document.documentElement.style.setProperty('--primary-dark', config.primaryDark);
      document.documentElement.style.setProperty('--badge-bg', config.badgeBg);

      document.getElementById("day-badge").innerText = config.badge;
      document.getElementById("day-title").innerText = config.title;
      document.getElementById("day-message").innerText = config.message;
      document.getElementById("illustration-container").innerHTML = svgs[dayNumber];

      // Atualiza botões ativos na prévia
      document.querySelectorAll('.preview-bar button').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${dayNumber}`);
      if (activeBtn) activeBtn.classList.add('active');

      // Controla exibição do banner de aniversário ou relógio na prévia
      if (config.isBday) {
        document.getElementById("countdown-box").style.display = "none";
        document.getElementById("bday-banner").style.display = "block";
        startConfetti();
      } else {
        document.getElementById("countdown-box").style.display = "grid";
        document.getElementById("bday-banner").style.display = "none";
        stopConfetti();
      }
    }

    // Detecta o dia atual automaticamente
    function initAutomaticDay() {
      const today = new Date();
      const day = today.getDate();
      const month = today.getMonth() + 1; // Novembro = 11

      if (month === 11 && day >= 16 && day <= 19) {
        setDayTheme(day);
      } else if (month === 11 && day > 19) {
        setDayTheme(19);
      } else {
        setDayTheme(16);
      }
    }

    // Sistema leve de confetes em tons de verde e dourado
    let confettiAnimId;
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function startConfetti() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ["#285e45", "#548269", "#8ec2a8", "#d4af37", "#ffffff"];
      particles = Array.from({ length: 75 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * 3 + 1.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10 - 5
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.fillStyle = p.color;
          ctx.ellipse(p.x, p.y, p.r, p.r * 0.6, p.tilt, 0, Math.PI * 2);
          ctx.fill();
          p.y += p.d;
          p.x += Math.sin(p.y * 0.02) * 1.2;
          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });
        confettiAnimId = requestAnimationFrame(draw);
      }
      cancelAnimationFrame(confettiAnimId);
      draw();
    }

    function stopConfetti() {
      cancelAnimationFrame(confettiAnimId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    initAutomaticDay();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
